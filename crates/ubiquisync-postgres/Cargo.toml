[package]
name = "ubiquisync-postgres"
description = "Postgres storage backend for Ubiquisync — conflict-free sync of structured data over commodity cloud storage or a dedicated server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ubiquisync-sql = { workspace = true }
async-trait = { workspace = true }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1"] }
deadpool-postgres = "0.14.1"
uuid = "1"
tokio = { version = "1", features = ["rt", "sync"] }
futures-util = "0.3"
bytes = "1"

[lints]
workspace = true

[dev-dependencies]
ubiquisync-sql = { workspace = true, features = ["test-support"] }
ubiquisync-tables = { workspace = true, features = ["test-support"] }
postgresql_embedded = "0.20"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
