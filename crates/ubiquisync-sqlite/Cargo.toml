[package]
name = "ubiquisync-sqlite"
description = "SQLite storage backend for Ubiquisync — conflict-free sync of structured data over commodity cloud storage or a dedicated server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ubiquisync-sql = { workspace = true }
async-trait = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
# Pull in the backend-agnostic processor suite to run it against `SqliteDb`.
ubiquisync-sql = { workspace = true, features = ["test-support"] }
