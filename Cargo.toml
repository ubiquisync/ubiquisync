[workspace]
resolver = "2"
members = [
  "crates/ubiquisync",
  "crates/ubiquisync-core",
  "crates/ubiquisync-sql",
  "crates/ubiquisync-postgres",
  "crates/ubiquisync-sqlite",
  "crates/ubiquisync-tables",
]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ubiquisync/ubiquisync"

# Workspace lints are opt-in and must be enabled per crate as each crate is ready.
# Kept at `warn` so local `cargo build` isn't blocked; CI escalates via
# `-D warnings` (clippy + `cargo doc`), so missing docs still fail the build there.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.dependencies]
ubiquisync-core = { path = "crates/ubiquisync-core", version = "0.0.4" }
ubiquisync-sql = { path = "crates/ubiquisync-sql", version = "0.0.4" }
ubiquisync-postgres = { path = "crates/ubiquisync-postgres", version = "0.0.4" }
ubiquisync-sqlite = { path = "crates/ubiquisync-sqlite", version = "0.0.4" }
ubiquisync-tables = { path = "crates/ubiquisync-tables", version = "0.0.4" }
async-trait = "0.1.89"
bitfield-struct = "0.13.0"
blake3 = "1.8.5"
futures = "0.3.32"
futures-channel = "0.3.32"
futures-core = "0.3.32"
pollster = "0.4.0"
thiserror = "2.0.18"
sea-query = { version = "1.0.1", default-features = false, features = ["derive", "backend-sqlite", "backend-postgres", "with-uuid"] }
uuid = { version = "1.23.4", default-features = false }
pastey = "0.2.3"
chacha20poly1305 = "0.11.0"
num_enum = "0.7.6"
ed25519-dalek = "3.0.0"
p256 = "0.14.0"
zeroize = {version = "1.9.0", features = ["zeroize_derive"]}
secrecy = "0.10.3"
