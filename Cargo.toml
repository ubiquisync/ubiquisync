[workspace]
resolver = "2"
members = [
  "crates/ubiquisync",
  "crates/ubiquisync-core",
  "crates/ubiquisync-sql",
  "crates/ubiquisync-postgres",
  "crates/ubiquisync-sqlite",
  "crates/ubiquisync-tables",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ubiquisync/ubiquisync"

# Workspace lints are opt-in and must be enabled per crate as each crate is ready.
# Kept at `warn` so local `cargo build` isn't blocked; CI escalates via
# `-D warnings` (clippy + `cargo doc`), so missing docs still fail the build there.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.dependencies]
ubiquisync-core = { path = "crates/ubiquisync-core", version = "0.0.2" }
ubiquisync-sql = { path = "crates/ubiquisync-sql", version = "0.0.2" }
ubiquisync-postgres = { path = "crates/ubiquisync-postgres", version = "0.0.2" }
ubiquisync-sqlite = { path = "crates/ubiquisync-sqlite", version = "0.0.2" }
ubiquisync-tables = { path = "crates/ubiquisync-tables", version = "0.0.2" }
async-trait = "0.1.89"
bitfield-struct = "0.13.0"
blake3 = "1.8.5"
futures-core = "0.3.31"
pollster = "0.4.0"
thiserror = "2.0.18"
